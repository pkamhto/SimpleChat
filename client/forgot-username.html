<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Username - SimpleChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <h2>Forgot Username</h2>

        <p>
            Enter your registered mobile number.
        </p>

        <input
            type="tel"
            id="mobile"
            placeholder="10-digit Mobile Number"
            maxlength="10"
            minlength="10"
            pattern="[6-9][0-9]{9}"
            inputmode="numeric"
        >

        <button type="button" id="sendOtpButton">
            Send OTP
        </button>

        <br><br>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            inputmode="numeric"
            style="display: none;"
        >

        <button
            type="button"
            id="verifyOtpButton"
            style="display: none;"
        >
            Verify OTP
        </button>

        <p id="message"></p>

        <p id="usernameResult"></p>

        <p>
            <a href="/login.html">Back to Login</a>
        </p>

    </div>

    <script src="forgot-username.js"></script>

</body>

</html>
