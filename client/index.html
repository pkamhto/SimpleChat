<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SimpleChat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #075e54,
                    #128c7e,
                    #25d366
                );

        }


        .welcome-container {

            width: 92%;

            max-width: 430px;

            padding: 45px 30px;

            text-align: center;

            background: rgba(
                255,
                255,
                255,
                0.96
            );

            border-radius: 24px;

            box-shadow:
                0 20px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

        }


        .logo {

            width: 85px;

            height: 85px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            font-size: 42px;

            background:
                #075e54;

            color: white;

            box-shadow:
                0 8px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.2
                );

        }


        h1 {

            margin:
                0 0 10px;

            font-size: 34px;

            color: #075e54;

        }


        .tagline {

            margin:
                0 auto 30px;

            color: #666;

            font-size: 16px;

            line-height: 1.6;

        }


        .button {

            display: block;

            width: 100%;

            padding: 14px;

            margin-bottom: 14px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 18px
                rgba(
                    0,
                    0,
                    0,
                    0.15
                );

        }


        .login-button {

            background:
                #075e54;

            color: white;

        }


        .register-button {

            background:
                #25d366;

            color: white;

        }


        .help-links {

            margin-top: 22px;

            display: flex;

            justify-content: center;

            gap: 20px;

            flex-wrap: wrap;

        }


        .help-links a {

            color:
                #075e54;

            font-size: 14px;

            text-decoration: none;

        }


        .help-links a:hover {

            text-decoration:
                underline;

        }


        .footer {

            margin-top: 30px;

            font-size: 12px;

            color: #999;

        }


        @media (
            max-width: 480px
        ) {

            .welcome-container {

                padding:
                    35px 22px;

                border-radius:
                    20px;

            }


            h1 {

                font-size:
                    30px;

            }

        }

    </style>

</head>


<body>

    <div class="welcome-container">


        <div class="logo">
            💬
        </div>


        <h1>
            SimpleChat
        </h1>


        <p class="tagline">

            Connect with friends,
            chat privately and
            stay connected.

        </p>


        <a
            href="/login.html"
            class="button login-button"
        >
            Login
        </a>


        <a
            href="/register.html"
            class="button register-button"
        >
            Create New Account
        </a>


        <div class="help-links">

            <a
                href="/forgot-username.html"
            >
                Forgot Username?
            </a>


            <a
                href="/forgot-password.html"
            >
                Forgot Password?
            </a>

        </div>


        <div class="footer">

            🔒 SimpleChat ·
            Private & Connected

        </div>


    </div>

</body>

</html>
