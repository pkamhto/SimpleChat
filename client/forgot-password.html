<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - SimpleChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <h2>Forgot Password</h2>

        <p>
            Enter your registered username, email or mobile number.
        </p>

        <input
            type="text"
            id="loginId"
            placeholder="Username / Email / Mobile"
        >

        <button type="button" id="sendOtpButton">
            Send OTP
        </button>

        <br><br>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            inputmode="numeric"
            style="display: none;"
        >

        <button
            type="button"
            id="verifyOtpButton"
            style="display: none;"
        >
            Verify OTP
        </button>

        <br><br>

        <div id="passwordSection" style="display: none;">

            <input
                type="password"
                id="newPassword"
                placeholder="New Password"
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm New Password"
            >

            <button type="button" id="resetPasswordButton">
                Reset Password
            </button>

        </div>

        <p id="message"></p>

        <p>
            <a href="/login.html">Back to Login</a>
        </p>

    </div>

    <script src="forgot-password.js"></script>

</body>

</html>
